model:
  name: "Qwen/Qwen2.5-7B-Instruct"
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  torch_dtype: "bfloat16"
  gradient_checkpointing: true

training:
  w_latency: 0.3
  inject_latency_context: true
  void_turn_filter: true
  num_generations: 4
  max_steps_per_episode: 8
  learning_rate: 5e-6
  kl_coeff: 0.04
  total_train_steps: 200
  eval_every_n_steps: 50
  random_seed: 42

data:
  benchmark: "catp_llm"  # "catp_llm" | "wild_tool_bench"
  catp_llm_path: "/home/cailinw/rl_tallm/external/OpenCATP-LLM/test_samples.json"
  wild_tool_bench_path: "/home/cailinw/rl_tallm/external/WildToolBench/wild-tool-bench/data/Wild-Tool-Bench.jsonl"
  strict_benchmark_loading: false
  allow_synthetic_fallback: true
  train_categories: ["Social", "Finance", "Weather", "News"]
  test_categories: ["Travel", "Sports"]
  min_tools_per_task: 2
  require_cost_variance: true

environment:
  executor_mode: "replay"  # "live" | "replay"
  trace_dir: "data/latency_traces"
  call_log_dir: "data/call_logs"
  timeout_threshold_ms: 5000

reward:
  r_task_correct: 1.0
  r_task_partial: 0.3
  r_timeout_penalty: -2.0
  latency_penalty_only_on_success: true

eval:
  degradation_multipliers: [2.0, 5.0]
  degradation_timeout_rates: [0.0, 0.15]
  n_eval_tasks: 200
